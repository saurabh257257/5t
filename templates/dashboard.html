<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENSEX Options</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0e17; color: #e2e8f0; min-height: 100vh; }

/* Header */
header {
  background: #1a1830; border-bottom: 1px solid #2d2b4e;
  padding: 0 24px; display: flex; align-items: center;
  justify-content: space-between; height: 56px;
  position: sticky; top: 0; z-index: 100;
}
.logo { font-size: 1em; font-weight: 700; color: #a78bfa; }
.btn-danger { padding: 6px 14px; border-radius: 8px; font-size: 0.82em; font-weight: 600; cursor: pointer; border: 1px solid #7f1d1d; background: #450a0a; color: #fca5a5; }
.btn-danger:hover { background: #7f1d1d; }

/* Page */
.page { max-width: 1600px; margin: 0 auto; padding: 20px 24px; }

/* Live Ticker */
.ticker {
  background: linear-gradient(135deg, #1a1830 0%, #1e1c45 100%);
  border: 1px solid #2d2b4e; border-radius: 14px;
  padding: 18px 24px; margin-bottom: 14px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
}
.ticker-left  { display: flex; align-items: baseline; gap: 14px; }
.ticker-label { font-size: 0.78em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #6b7280; }
.ticker-ltp   { font-size: 2.4em; font-weight: 800; color: #e2e8f0; line-height: 1; }
.ticker-change { font-size: 1em; font-weight: 700; }
.ticker-right { display: flex; align-items: center; gap: 20px; }
.ticker-ohlc  { font-size: 0.8em; color: #6b7280; line-height: 1.8; }
.ticker-ohlc span { color: #94a3b8; font-weight: 600; }
.ticker-close { font-size: 0.8em; color: #6b7280; }
.ticker-close span { color: #a78bfa; font-weight: 700; }
.live-dot {
  font-size: 0.72em; font-weight: 700; color: #34d399;
  display: flex; align-items: center; gap: 5px;
}
.live-dot::before {
  content: ''; display: inline-block; width: 7px; height: 7px;
  background: #34d399; border-radius: 50%; animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.4)} }
.ticker-time { font-size: 0.75em; color: #4b5563; }

/* Controls */
.controls {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: #1a1830; border: 1px solid #2d2b4e; border-radius: 10px;
  padding: 12px 18px; margin-bottom: 14px;
}
.controls label { font-size: 0.82em; color: #6b7280; font-weight: 600; }
.sx-select {
  padding: 8px 14px; background: #12111f; border: 1px solid #2d2b4e;
  border-radius: 8px; color: #e2e8f0; font-size: 0.85em; outline: none; cursor: pointer; min-width: 220px;
}
.sx-select:focus { border-color: #7c3aed; }
.btn-load { padding: 8px 20px; background: #7c3aed; color: white; border: none; border-radius: 8px; font-size: 0.85em; font-weight: 600; cursor: pointer; }
.btn-load:hover { background: #6d28d9; }
.status-txt { font-size: 0.78em; color: #6b7280; }

/* Chain + AI two-column layout */
.chain-ai-wrap { display: flex; gap: 14px; align-items: flex-start; }
.chain-ai-wrap .chain-card { flex: 1; min-width: 0; margin-bottom: 0; }

/* Option Chain */
.chain-card {
  background: #1a1830; border: 1px solid #2d2b4e; border-radius: 14px; overflow: hidden;
}
.chain-scroll { overflow-x: auto; max-height: calc(100vh - 220px); overflow-y: auto; }
.sx-table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
.sx-table thead { position: sticky; top: 0; z-index: 10; }
.sx-table th {
  padding: 10px 14px; font-size: 0.7em; text-transform: uppercase;
  letter-spacing: 0.5px; background: #12111f; border-bottom: 1px solid #2d2b4e; white-space: nowrap;
}
.sx-table th.ce-hd  { text-align: right; color: #34d399; }
.sx-table th.pe-hd  { text-align: left;  color: #f87171; }
.sx-table th.str-hd { text-align: center; color: #a78bfa; background: #1e1c35; min-width: 100px; }
.sx-table td        { padding: 9px 14px; border-bottom: 1px solid #1e1c35; white-space: nowrap; color: #cbd5e1; }
.sx-table td.ce-td  { text-align: right; }
.sx-table td.pe-td  { text-align: left; }
.sx-table td.str-td { text-align: center; font-weight: 800; color: #a78bfa; background: #1e1c35; }
.sx-table tr.atm td         { background: rgba(124,58,237,0.08) !important; }
.sx-table tr.atm td.str-td  { background: rgba(124,58,237,0.22) !important; }
.sx-table tr:hover td       { background: #1e1c35; cursor: default; }
.sx-table tr:hover td.str-td{ background: #2d2b4e; }
.ce-cell { cursor: pointer; }
.pe-cell { cursor: pointer; }
.ce-cell:hover { background: rgba(52,211,153,0.1) !important; }
.pe-cell:hover { background: rgba(248,113,113,0.1) !important; }
.sx-table tr.sel-ce td.ce-td { background: rgba(52,211,153,0.13) !important; }
.sx-table tr.sel-pe td.pe-td { background: rgba(248,113,113,0.13) !important; }
.chg-pos { color: #34d399; font-weight: 600; }
.chg-neg { color: #f87171; font-weight: 600; }
.ce-ltp  { font-weight: 700; color: #a3e635; }
.pe-ltp  { font-weight: 700; color: #fb7185; }

/* AI Side Panel */
.ai-panel {
  width: 360px; flex-shrink: 0;
  background: #1a1830; border: 1px solid #2d2b4e; border-radius: 14px;
  overflow: hidden; position: sticky; top: 70px;
  max-height: calc(100vh - 90px);
  display: flex; flex-direction: column;
  animation: slideIn 0.2s ease;
}
@keyframes slideIn { from{opacity:0;transform:translateX(12px)} to{opacity:1;transform:translateX(0)} }

.ai-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid #2d2b4e; background: #12111f; flex-shrink: 0;
}
.ai-header-left { display: flex; align-items: center; gap: 8px; }
.ai-title { font-weight: 700; font-size: 0.9em; color: #e2e8f0; }
.ai-badge {
  font-size: 0.6em; padding: 2px 7px; border-radius: 10px;
  background: #1e1c45; color: #a78bfa; border: 1px solid #4c3f8a;
  font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
}
.ai-header-right { display: flex; align-items: center; gap: 6px; }
.ai-refresh {
  padding: 4px 10px; border-radius: 6px; font-size: 0.75em; font-weight: 600;
  cursor: pointer; border: 1px solid #2d2b4e; background: transparent; color: #94a3b8; transition: all 0.15s;
}
.ai-refresh:hover { border-color: #7c3aed; color: #a78bfa; }
.btn-close {
  padding: 4px 10px; border-radius: 6px; font-size: 0.8em; font-weight: 600;
  cursor: pointer; border: 1px solid #4c3f8a; background: transparent; color: #a78bfa;
}
.btn-close:hover { background: #2d2b4e; }

.ai-body { padding: 0; overflow-y: auto; flex: 1; font-size: 0.82em; line-height: 1.7; color: #cbd5e1; }
.ai-loading { padding: 40px; text-align: center; }
.ai-loading .spinner {
  width: 26px; height: 26px; border: 2px solid #2d2b4e; border-top-color: #7c3aed;
  border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px;
}
.ai-loading-text { font-size: 0.82em; color: #6b7280; }
.ai-loading-sub  { font-size: 0.72em; color: #4b5563; margin-top: 4px; }
@keyframes spin { to { transform: rotate(360deg); } }

.ai-strike-bar {
  padding: 10px 16px; background: rgba(124,58,237,0.08);
  border-bottom: 1px solid #2d2b4e; display: flex; gap: 14px; flex-wrap: wrap;
}
.ai-strike-info .lbl { font-size: 0.72em; color: #6b7280; }
.ai-strike-info .val { font-weight: 700; font-size: 0.85em; }
.ai-strike-info .val.ce  { color: #34d399; }
.ai-strike-info .val.pe  { color: #f87171; }
.ai-strike-info .val.str { color: #a78bfa; }

.ai-content { padding: 14px 16px; }
.ai-section { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #1e1c35; }
.ai-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.ai-section-title {
  font-size: 0.7em; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.8px; color: #7c3aed; margin-bottom: 5px;
}
.ai-section-body { color: #cbd5e1; font-size: 0.88em; line-height: 1.65; }
.ai-section-body strong { color: #e2e8f0; }
.ai-section-body .bull { color: #34d399; font-weight: 600; }
.ai-section-body .bear { color: #f87171; font-weight: 600; }
.ai-section-body .neu  { color: #fbbf24; font-weight: 600; }
.ai-trade-box {
  background: rgba(124,58,237,0.1); border: 1px solid #4c3f8a;
  border-radius: 8px; padding: 10px 12px; margin-top: 6px;
  font-size: 0.88em; color: #c4b5fd; line-height: 1.6;
}
.ai-trade-box strong { color: #a78bfa; }
.ai-error { padding: 20px 16px; color: #f87171; font-size: 0.82em; }

/* States */
.state-box { padding: 52px; text-align: center; color: #4b5563; font-size: 0.9em; }
.state-icon { font-size: 2.4em; margin-bottom: 12px; }
.spinner { width: 30px; height: 30px; border: 3px solid #2d2b4e; border-top-color: #7c3aed; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px; }

@media (max-width: 900px) {
  .chain-ai-wrap { flex-direction: column; }
  .ai-panel { width: 100%; position: static; max-height: none; }
}
</style>
</head>
<body>

<header>
  <div class="logo">&#x1F4CA; SENSEX Options Dashboard</div>
  <a href="/logout"><button class="btn-danger">Logout</button></a>
</header>

<div class="page">

  <!-- Live Ticker -->
  <div class="ticker">
    <div class="ticker-left">
      <span class="ticker-label">SENSEX</span>
      <span class="ticker-ltp" id="sxLtp">—</span>
      <span class="ticker-change" id="sxChange">—</span>
    </div>
    <div class="ticker-right">
      <div class="ticker-ohlc">
        O&nbsp;<span id="sxOpen">—</span>&nbsp;&nbsp;
        H&nbsp;<span id="sxHigh" style="color:#34d399">—</span>&nbsp;&nbsp;
        L&nbsp;<span id="sxLow" style="color:#f87171">—</span>
      </div>
      <div class="ticker-close">Prev Close&nbsp;<span id="sxClose">—</span></div>
      <span class="live-dot">LIVE</span>
      <span class="ticker-time" id="sxTime">—</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <label>Expiry</label>
    <select class="sx-select" id="expirySelect">
      <option value="">Loading expiries…</option>
    </select>
    <button class="btn-load" onclick="loadChain()">Load Chain</button>
    <span class="status-txt" id="statusTxt"></span>
  </div>

  <!-- Option Chain + AI Panel -->
  <div class="chain-ai-wrap">

    <div class="chain-card">
      <div id="chainBody">
        <div class="state-box">
          <div class="state-icon">&#x1F4CA;</div>
          Select an expiry and click Load Chain
        </div>
      </div>
    </div>

    <div class="ai-panel" id="aiPanel" style="display:none">
      <div class="ai-header">
        <div class="ai-header-left">
          <span class="ai-title" id="aiTitle">Analysis</span>
          <span class="ai-badge">Claude AI</span>
        </div>
        <div class="ai-header-right">
          <button class="ai-refresh" onclick="reanalyze()">&#x21BB; Refresh</button>
          <button class="btn-close" onclick="closeAiPanel()">&#x2715;</button>
        </div>
      </div>
      <div class="ai-body" id="aiBody"></div>
    </div>

  </div>
</div>

<script>
const fmt2  = n => parseFloat(n||0).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtN  = n => parseInt(n||0).toLocaleString('en-IN');
const fmtChg = n => {
  const v = parseInt(n||0);
  return `<span class="${v>=0?'chg-pos':'chg-neg'}">${v>=0?'+':''}${v.toLocaleString('en-IN')}</span>`;
};
const nowStr = () => new Date().toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit',second:'2-digit'});

async function get(url) {
  const r = await fetch(url);
  return r.json();
}

// ── Live SENSEX ───────────────────────────────────────────────────────────────
async function loadLtp() {
  const d = await get('/api/sensex-ltp');
  if (d.error) return;
  const up = d.change >= 0;
  const ltp = d.ltp || d.close;  // use close if LTP is 0 (market closed)
  document.getElementById('sxLtp').textContent = fmt2(ltp);
  document.getElementById('sxLtp').style.color = up ? '#34d399' : '#f87171';
  document.getElementById('sxChange').innerHTML =
    `<span style="color:${up?'#34d399':'#f87171'}">${up?'▲':'▼'} ${Math.abs(d.change).toFixed(2)} (${up?'+':''}${d.change_pct.toFixed(2)}%)</span>`;
  document.getElementById('sxOpen').textContent  = fmt2(d.open);
  document.getElementById('sxHigh').textContent  = fmt2(d.high);
  document.getElementById('sxLow').textContent   = fmt2(d.low);
  document.getElementById('sxClose').textContent = fmt2(d.close);
  document.getElementById('sxTime').textContent  = nowStr();
}

// ── Expiries ──────────────────────────────────────────────────────────────────
async function loadExpiries() {
  const d   = await get('/api/expiry?exch=B&symbol=SENSEX');
  const sel = document.getElementById('expirySelect');
  if (d.error || !d.expiries?.length) {
    sel.innerHTML = '<option value="">Failed to load expiries</option>';
    return;
  }
  sel.innerHTML = d.expiries.map(e => `<option value="${e.ts}">${e.label}</option>`).join('');
}

// ── Option Chain ──────────────────────────────────────────────────────────────
let chainData = [];

async function loadChain() {
  const sel   = document.getElementById('expirySelect');
  const ts    = sel.value;
  const label = sel.options[sel.selectedIndex]?.text || '';
  if (!ts) return;

  document.getElementById('statusTxt').textContent = 'Loading…';
  document.getElementById('chainBody').innerHTML =
    '<div class="state-box"><div class="spinner"></div>Loading option chain…</div>';
  closeAiPanel();

  const d = await get(`/api/option-chain?exch=B&symbol=SENSEX&expiry_ts=${ts}`);
  document.getElementById('statusTxt').textContent = '';

  if (d.error || !d.option_chain?.length) {
    document.getElementById('chainBody').innerHTML =
      `<div class="state-box"><div class="state-icon">&#x26A0;</div>${d.error || 'No data'}</div>`;
    return;
  }

  chainData = d.option_chain;

  const ltpVal = parseFloat(document.getElementById('sxLtp').textContent.replace(/,/g,'')) || 0;
  const strikes = d.option_chain.map(r => r.strike);
  const atm = strikes.reduce((a,b) => Math.abs(b-ltpVal) < Math.abs(a-ltpVal) ? b : a, strikes[0]);

  const rows = d.option_chain.map(r => {
    const isAtm = r.strike === atm;
    const cs = r.ce_scrip || 0, ps = r.pe_scrip || 0;
    const ce = cs ? `onclick="pick(this,'ce',${r.strike},${cs},${ps})"` : '';
    const pe = ps ? `onclick="pick(this,'pe',${r.strike},${cs},${ps})"` : '';
    return `<tr class="${isAtm?'atm':''}" data-strike="${r.strike}">
      <td class="ce-td ce-cell" ${ce}>${fmtChg(r.ce_chg_oi)}</td>
      <td class="ce-td ce-cell" ${ce}>${fmtN(r.ce_oi)}</td>
      <td class="ce-td ce-cell" ${ce}>${fmtN(r.ce_vol)}</td>
      <td class="ce-td ce-cell ce-ltp" ${ce}>${r.ce_ltp > 0 ? fmt2(r.ce_ltp) : '—'}</td>
      <td class="str-td">${r.strike}${isAtm ? '&nbsp;<span style="font-size:0.6em;color:#7c3aed">ATM</span>' : ''}</td>
      <td class="pe-td pe-cell pe-ltp" ${pe}>${r.pe_ltp > 0 ? fmt2(r.pe_ltp) : '—'}</td>
      <td class="pe-td pe-cell" ${pe}>${fmtN(r.pe_vol)}</td>
      <td class="pe-td pe-cell" ${pe}>${fmtN(r.pe_oi)}</td>
      <td class="pe-td pe-cell" ${pe}>${fmtChg(r.pe_chg_oi)}</td>
    </tr>`;
  }).join('');

  document.getElementById('chainBody').innerHTML = `
    <div class="chain-scroll">
      <table class="sx-table">
        <thead>
          <tr>
            <th class="ce-hd" colspan="4">── CALLS (CE) ──</th>
            <th class="str-hd">STRIKE</th>
            <th class="pe-hd" colspan="4">── PUTS (PE) ──</th>
          </tr>
          <tr>
            <th class="ce-hd">ChgOI</th><th class="ce-hd">OI</th><th class="ce-hd">Vol</th><th class="ce-hd">LTP</th>
            <th class="str-hd">&#9733;</th>
            <th class="pe-hd">LTP</th><th class="pe-hd">Vol</th><th class="pe-hd">OI</th><th class="pe-hd">ChgOI</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

  document.getElementById('statusTxt').textContent =
    `${d.option_chain.length} strikes · ${label} · Click any CE/PE cell for AI analysis`;

  setTimeout(() => {
    document.querySelector('#chainBody .atm')?.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 120);
}

// ── AI Panel ──────────────────────────────────────────────────────────────────
let currentStrike = null, currentCeScrip = null, currentPeScrip = null;

function pick(cell, side, strike, ceScrip, peScrip) {
  document.querySelectorAll('#chainBody tr').forEach(r => r.classList.remove('sel-ce','sel-pe'));
  cell.closest('tr').classList.add(side === 'ce' ? 'sel-ce' : 'sel-pe');
  currentStrike = strike; currentCeScrip = ceScrip; currentPeScrip = peScrip;
  const row = chainData.find(r => r.strike === strike);
  showAnalysis(strike, ceScrip, peScrip, row);
}

function reanalyze() {
  if (currentStrike) {
    const row = chainData.find(r => r.strike === currentStrike);
    showAnalysis(currentStrike, currentCeScrip, currentPeScrip, row);
  }
}

function closeAiPanel() {
  document.getElementById('aiPanel').style.display = 'none';
  currentStrike = null;
  document.querySelectorAll('#chainBody tr').forEach(r => r.classList.remove('sel-ce','sel-pe'));
}

async function showAnalysis(strike, ceScrip, peScrip, row) {
  const panel = document.getElementById('aiPanel');
  const body  = document.getElementById('aiBody');
  panel.style.display = 'flex';
  document.getElementById('aiTitle').textContent = `SENSEX ${strike}`;

  const ceLtp = row ? fmt2(row.ce_ltp) : '—';
  const peLtp = row ? fmt2(row.pe_ltp) : '—';

  body.innerHTML = `
    <div class="ai-strike-bar">
      <div class="ai-strike-info"><div class="lbl">Strike</div><div class="val str">${strike}</div></div>
      <div class="ai-strike-info"><div class="lbl">CE LTP</div><div class="val ce">₹${ceLtp}</div></div>
      <div class="ai-strike-info"><div class="lbl">PE LTP</div><div class="val pe">₹${peLtp}</div></div>
    </div>
    <div class="ai-loading">
      <div class="spinner"></div>
      <div class="ai-loading-text">Claude is analyzing…</div>
      <div class="ai-loading-sub">Fetching CE &amp; PE history</div>
    </div>`;

  const d = await get(`/api/analyze?ce_scrip=${ceScrip}&pe_scrip=${peScrip}&strike=${strike}&interval=15m&days=2`);

  const bar = body.querySelector('.ai-strike-bar')?.outerHTML || '';
  if (d.error) {
    body.innerHTML = bar + `<div class="ai-error">&#x26A0; ${d.error}</div>`;
    return;
  }
  body.innerHTML = bar + renderAnalysis(d.summary);
}

function inlineMd(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em style="color:#94a3b8">$1</em>')
    .replace(/bullish/gi, '<span class="bull">Bullish</span>')
    .replace(/bearish/gi, '<span class="bear">Bearish</span>')
    .replace(/neutral/gi, '<span class="neu">Neutral</span>');
}

const ICONS = { trend:'📈', 'key level':'🎯', volume:'📊', bias:'⚖️', 'market bias':'⚖️', trade:'💡', 'trade idea':'💡' };

function renderAnalysis(text) {
  if (!text) return '<div class="ai-error">No response.</div>';
  const re = /^\d+\.\s+\*\*(.+?)\*\*\s*[—–-]?\s*([\s\S]*?)(?=^\d+\.\s+\*\*|\s*$)/gm;
  const sections = [];
  let m;
  while ((m = re.exec(text + '\n')) !== null) {
    sections.push({ title: m[1].trim(), body: m[2].trim() });
  }
  if (sections.length > 0) {
    return '<div class="ai-content">' + sections.map(s => {
      const key  = Object.keys(ICONS).find(k => s.title.toLowerCase().includes(k));
      const icon = key ? ICONS[key] : '•';
      const isTradeIdea = s.title.toLowerCase().includes('trade');
      const bodyHtml = inlineMd(s.body.replace(/\n/g, ' '));
      return `<div class="ai-section">
        <div class="ai-section-title">${icon} ${s.title}</div>
        ${isTradeIdea
          ? `<div class="ai-trade-box">${bodyHtml}</div>`
          : `<div class="ai-section-body">${bodyHtml}</div>`}
      </div>`;
    }).join('') + '</div>';
  }
  const lines = text.split('\n').filter(l => l.trim());
  return '<div class="ai-content">' + lines.map(l => `<p style="margin:5px 0">${inlineMd(l)}</p>`).join('') + '</div>';
}

// ── Init ──────────────────────────────────────────────────────────────────────
loadLtp();
setInterval(loadLtp, 5000);
loadExpiries().then(() => {
  const sel = document.getElementById('expirySelect');
  if (sel?.value) loadChain();
});
</script>
</body>
</html>
