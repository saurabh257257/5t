<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5Paisa Dashboard</title>
<style>
/* ── Reset & Base ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0f0e17;
  color: #e2e8f0;
  min-height: 100vh;
}

/* ── Layout ───────────────────────────────────────────────── */
.app { display: flex; flex-direction: column; min-height: 100vh; }

/* ── Header ───────────────────────────────────────────────── */
header {
  background: #1a1830;
  border-bottom: 1px solid #2d2b4e;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 60px;
  position: sticky; top: 0; z-index: 100;
}
.logo { display: flex; align-items: center; gap: 10px; font-size: 1.1em; font-weight: 700; color: #a78bfa; }
.logo span { font-size: 1.4em; }
.header-right { display: flex; align-items: center; gap: 10px; }
.btn-sm {
  padding: 6px 14px; border-radius: 8px; font-size: 0.82em;
  font-weight: 600; cursor: pointer; border: none; transition: all 0.2s;
}
.btn-ghost { background: transparent; color: #a78bfa; border: 1px solid #4c3f8a; }
.btn-ghost:hover { background: #2d2b4e; }
.btn-danger { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; }
.btn-danger:hover { background: #7f1d1d; }

/* ── Tab Bar ─────────────────────────────────────────────── */
.tabs {
  display: flex;
  background: #1a1830;
  border-bottom: 1px solid #2d2b4e;
  padding: 0 24px;
}
.tab {
  padding: 14px 20px;
  cursor: pointer;
  font-size: 0.88em;
  font-weight: 600;
  color: #6b7280;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  user-select: none;
}
.tab:hover { color: #a78bfa; }
.tab.active { color: #a78bfa; border-bottom-color: #7c3aed; }

/* ── Main Content ─────────────────────────────────────────── */
.content { flex: 1; padding: 24px; max-width: 1300px; margin: 0 auto; width: 100%; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── Summary Cards ───────────────────────────────────────── */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: #1a1830;
  border: 1px solid #2d2b4e;
  border-radius: 14px;
  padding: 20px;
}
.stat-label { font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.8px; color: #6b7280; margin-bottom: 8px; }
.stat-value { font-size: 1.6em; font-weight: 700; color: #e2e8f0; }
.stat-value.profit { color: #34d399; }
.stat-value.loss { color: #f87171; }

/* ── Table ───────────────────────────────────────────────── */
.table-card {
  background: #1a1830;
  border: 1px solid #2d2b4e;
  border-radius: 14px;
  overflow: hidden;
}
.table-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid #2d2b4e;
}
.table-title { font-weight: 700; font-size: 0.95em; color: #a78bfa; }
table { width: 100%; border-collapse: collapse; }
thead { background: #12111f; }
th {
  padding: 12px 16px; text-align: left;
  font-size: 0.75em; text-transform: uppercase;
  letter-spacing: 0.6px; color: #6b7280;
  border-bottom: 1px solid #2d2b4e;
  white-space: nowrap;
}
td {
  padding: 13px 16px;
  border-bottom: 1px solid #1e1c35;
  font-size: 0.88em; color: #cbd5e1;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: #1e1c35; }
.symbol-cell { font-weight: 700; color: #e2e8f0; }
.profit { color: #34d399; font-weight: 600; }
.loss { color: #f87171; font-weight: 600; }

/* ── Search Tab ──────────────────────────────────────────── */
.search-layout { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; }
@media (max-width: 768px) { .search-layout { grid-template-columns: 1fr; } }

.search-panel {
  background: #1a1830;
  border: 1px solid #2d2b4e;
  border-radius: 14px;
  overflow: hidden;
}
.search-box { padding: 14px; border-bottom: 1px solid #2d2b4e; }
.search-input {
  width: 100%; padding: 10px 14px;
  background: #12111f; border: 1px solid #2d2b4e;
  border-radius: 8px; color: #e2e8f0; font-size: 0.9em; outline: none;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: #7c3aed; }
.search-results { max-height: 480px; overflow-y: auto; }
.result-item {
  padding: 12px 14px; cursor: pointer;
  border-bottom: 1px solid #1e1c35;
  transition: background 0.15s;
}
.result-item:last-child { border-bottom: none; }
.result-item:hover, .result-item.selected { background: #2d2b4e; }
.result-name { font-weight: 600; font-size: 0.88em; color: #e2e8f0; }
.result-meta { font-size: 0.75em; color: #6b7280; margin-top: 3px; }
.result-badge {
  display: inline-block; padding: 2px 7px;
  border-radius: 4px; font-size: 0.7em; font-weight: 700;
  margin-left: 6px;
}
.badge-eq { background: #1e3a5f; color: #60a5fa; }
.badge-fno { background: #3b1d6e; color: #c084fc; }
.badge-fut { background: #1a3a2a; color: #4ade80; }

/* ── Scrip Detail ────────────────────────────────────────── */
.detail-panel {
  background: #1a1830;
  border: 1px solid #2d2b4e;
  border-radius: 14px;
  padding: 20px;
}
.detail-header { margin-bottom: 20px; }
.detail-symbol { font-size: 1.5em; font-weight: 800; color: #e2e8f0; }
.detail-name { font-size: 0.85em; color: #6b7280; margin-top: 4px; }
.price-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.price-card {
  background: #12111f;
  border: 1px solid #2d2b4e;
  border-radius: 10px;
  padding: 14px;
}
.price-label { font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.5px; color: #6b7280; margin-bottom: 6px; }
.price-value { font-size: 1.15em; font-weight: 700; color: #e2e8f0; }
.price-value.ltp-value { font-size: 1.5em; color: #a78bfa; }

/* ── Option Chain ────────────────────────────────────────── */
.oc-controls {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 16px; flex-wrap: wrap;
}
.oc-select {
  padding: 8px 12px; background: #12111f;
  border: 1px solid #2d2b4e; border-radius: 8px;
  color: #e2e8f0; font-size: 0.85em; outline: none; cursor: pointer;
}
.btn-load {
  padding: 8px 16px; background: #7c3aed; color: white;
  border: none; border-radius: 8px; font-size: 0.85em;
  font-weight: 600; cursor: pointer; transition: background 0.2s;
}
.btn-load:hover { background: #6d28d9; }
.oc-table-wrap { overflow-x: auto; }
.oc-table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
.oc-table th {
  padding: 10px 12px; text-align: right;
  font-size: 0.72em; letter-spacing: 0.5px; color: #6b7280;
  background: #12111f; border-bottom: 1px solid #2d2b4e;
}
.oc-table th.strike-col { text-align: center; background: #1e1c35; color: #a78bfa; }
.oc-table th.call-side { color: #34d399; }
.oc-table th.put-side { color: #f87171; }
.oc-table td { padding: 10px 12px; text-align: right; border-bottom: 1px solid #1e1c35; color: #cbd5e1; }
.oc-table td.strike-col { text-align: center; font-weight: 800; color: #a78bfa; background: #1e1c35; }
.oc-table tr.atm td { background: #1e1c35 !important; }
.oc-table tr.atm td.strike-col { background: #2d2b4e !important; }

/* ── States ──────────────────────────────────────────────── */
.state-box {
  padding: 48px; text-align: center; color: #4b5563;
  font-size: 0.9em;
}
.state-icon { font-size: 2.5em; margin-bottom: 12px; }
.spinner {
  width: 32px; height: 32px;
  border: 3px solid #2d2b4e;
  border-top-color: #7c3aed;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty-hint { margin-top: 8px; font-size: 0.8em; color: #4b5563; }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="logo"><span>&#x1F4BC;</span> 5Paisa Dashboard</div>
    <div class="header-right">
      <button class="btn-sm btn-ghost" onclick="refreshCurrent()">&#x21BB; Refresh</button>
      <a href="/logout"><button class="btn-sm btn-danger">Logout</button></a>
    </div>
  </header>

  <!-- Tab Bar -->
  <nav class="tabs">
    <div class="tab active" data-tab="holdings">&#x1F4C8; Holdings</div>
    <div class="tab" data-tab="search">&#x1F50D; Search Scrip</div>
  </nav>

  <!-- Content -->
  <main class="content">

    <!-- ── Holdings Tab ───────────────────────────────────── -->
    <section class="tab-panel active" id="panel-holdings">
      <div class="summary-grid" id="summary" style="display:none">
        <div class="stat-card">
          <div class="stat-label">Total Invested</div>
          <div class="stat-value" id="s-invested">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Current Value</div>
          <div class="stat-value" id="s-value">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total P&amp;L</div>
          <div class="stat-value" id="s-pnl">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Return</div>
          <div class="stat-value" id="s-return">—</div>
        </div>
      </div>
      <div class="table-card">
        <div class="table-header">
          <span class="table-title">Your Holdings</span>
        </div>
        <div id="holdings-body">
          <div class="state-box"><div class="spinner"></div>Loading holdings…</div>
        </div>
      </div>
    </section>

    <!-- ── Search Tab ─────────────────────────────────────── -->
    <section class="tab-panel" id="panel-search">
      <div class="search-layout">

        <!-- Left: Search + Results -->
        <div class="search-panel">
          <div class="search-box">
            <input type="text" class="search-input" id="searchInput"
              placeholder="Search symbol, name…" autocomplete="off">
          </div>
          <div class="search-results" id="searchResults">
            <div class="state-box">
              <div class="state-icon">&#x1F50D;</div>
              Type to search scrips
            </div>
          </div>
        </div>

        <!-- Right: Detail -->
        <div id="detailPanel">
          <div class="state-box">
            <div class="state-icon">&#x1F4CA;</div>
            Select a scrip to view details
          </div>
        </div>

      </div>
    </section>

  </main>
</div>

<script>
// ── Helpers ────────────────────────────────────────────────────────────────
const fmt  = n => '₹' + parseFloat(n).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtN = n => parseInt(n).toLocaleString('en-IN');
const pct  = n => (n >= 0 ? '+' : '') + parseFloat(n).toFixed(2) + '%';
const cls  = n => parseFloat(n) >= 0 ? 'profit' : 'loss';

async function api(url) {
  const r = await fetch(url);
  return r.json();
}

// ── Tabs ───────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

function refreshCurrent() {
  const active = document.querySelector('.tab.active')?.dataset.tab;
  if (active === 'holdings') loadHoldings();
}

// ── Holdings ───────────────────────────────────────────────────────────────
async function loadHoldings() {
  document.getElementById('holdings-body').innerHTML =
    '<div class="state-box"><div class="spinner"></div>Loading…</div>';
  document.getElementById('summary').style.display = 'none';

  const data = await api('/api/holdings');
  if (data.error) {
    document.getElementById('holdings-body').innerHTML =
      `<div class="state-box"><div class="state-icon">&#x26A0;</div>${data.error}</div>`;
    return;
  }
  if (!data.holdings?.length) {
    document.getElementById('holdings-body').innerHTML =
      '<div class="state-box"><div class="state-icon">&#x1F4ED;</div>No holdings found</div>';
    return;
  }

  let invested = 0, curVal = 0;
  const rows = data.holdings.map(h => {
    const val  = h.quantity * h.ltp;
    const cost = h.quantity * h.cost;
    const pnl  = val - cost;
    const ret  = cost > 0 ? (pnl / cost * 100) : 0;
    invested += cost; curVal += val;
    return `<tr>
      <td class="symbol-cell">${h.symbol}</td>
      <td>${fmtN(h.quantity)}</td>
      <td>${fmt(h.cost)}</td>
      <td>${fmt(h.ltp)}</td>
      <td>${fmt(val)}</td>
      <td class="${cls(pnl)}">${fmt(pnl)}</td>
      <td class="${cls(ret)}">${pct(ret)}</td>
    </tr>`;
  }).join('');

  document.getElementById('holdings-body').innerHTML = `
    <table>
      <thead><tr>
        <th>Symbol</th><th>Qty</th><th>Avg Cost</th>
        <th>LTP</th><th>Curr Value</th><th>P&amp;L</th><th>Return %</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

  const pnl = curVal - invested;
  const ret = invested > 0 ? pnl / invested * 100 : 0;
  document.getElementById('s-invested').innerHTML = fmt(invested);
  document.getElementById('s-value').innerHTML    = fmt(curVal);
  document.getElementById('s-pnl').className      = 'stat-value ' + cls(pnl);
  document.getElementById('s-pnl').innerHTML      = fmt(pnl);
  document.getElementById('s-return').className   = 'stat-value ' + cls(ret);
  document.getElementById('s-return').innerHTML   = pct(ret);
  document.getElementById('summary').style.display = 'grid';
}

// ── Search ─────────────────────────────────────────────────────────────────
let searchTimer;
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (q.length < 2) {
    document.getElementById('searchResults').innerHTML =
      '<div class="state-box"><div class="state-icon">&#x1F50D;</div>Type to search scrips</div>';
    return;
  }
  document.getElementById('searchResults').innerHTML =
    '<div class="state-box"><div class="spinner"></div>Searching…</div>';
  searchTimer = setTimeout(() => doSearch(q), 300);
});

async function doSearch(q) {
  const data = await api('/api/search?q=' + encodeURIComponent(q));
  if (!data.results?.length) {
    document.getElementById('searchResults').innerHTML =
      '<div class="state-box"><div class="state-icon">&#x1F914;</div>No results found</div>';
    return;
  }
  document.getElementById('searchResults').innerHTML = data.results.map((r, i) => {
    const code = r.Scripcode || r.scripcode || '';
    const name = r.Name || r.name || '';
    const exch = r.Exch || r.exch || '';
    const type = r.ExchType || r.exchtype || '';
    const series = r.Series || r.series || '';
    const isFno = type === 'D' || ['FUT','CE','PE'].includes(series);
    const badge = isFno
      ? `<span class="result-badge badge-fno">${series || 'FNO'}</span>`
      : `<span class="result-badge badge-eq">${series || 'EQ'}</span>`;
    return `<div class="result-item" onclick="selectScrip(${JSON.stringify(r).replace(/"/g,"&quot;")})" data-i="${i}">
      <div class="result-name">${name}${badge}</div>
      <div class="result-meta">${exch} &bull; Code: ${code}</div>
    </div>`;
  }).join('');
}

// ── Scrip Detail ───────────────────────────────────────────────────────────
async function selectScrip(r) {
  document.querySelectorAll('.result-item').forEach(el => el.classList.remove('selected'));
  event?.currentTarget?.classList.add('selected');

  const code   = r.Scripcode || r.scripcode || '';
  const name   = r.Name || r.name || '';
  const exch   = r.Exch || r.exch || 'N';
  const type   = r.ExchType || r.exchtype || 'C';
  const series = r.Series || r.series || '';
  const isFno  = type === 'D' || ['FUT','CE','PE'].includes(series);
  const short  = r.ShortName || r.shortname || name;

  document.getElementById('detailPanel').innerHTML =
    '<div class="detail-panel"><div class="state-box"><div class="spinner"></div>Loading price…</div></div>';

  const ltp = await api(`/api/ltp?scripcode=${code}&exch=${exch}&exch_type=${type}`);

  let priceHtml = '';
  if (ltp.error) {
    priceHtml = `<div class="state-box" style="padding:20px">&#x26A0; ${ltp.error}</div>`;
  } else {
    const chgCls = cls(ltp.change);
    priceHtml = `
      <div class="price-grid">
        <div class="price-card">
          <div class="price-label">LTP</div>
          <div class="price-value ltp-value">${fmt(ltp.ltp)}</div>
        </div>
        <div class="price-card">
          <div class="price-label">Change</div>
          <div class="price-value ${chgCls}">${fmt(ltp.change)} (${pct(ltp.change_pct)})</div>
        </div>
        <div class="price-card">
          <div class="price-label">Open</div>
          <div class="price-value">${fmt(ltp.open)}</div>
        </div>
        <div class="price-card">
          <div class="price-label">High</div>
          <div class="price-value profit">${fmt(ltp.high)}</div>
        </div>
        <div class="price-card">
          <div class="price-label">Low</div>
          <div class="price-value loss">${fmt(ltp.low)}</div>
        </div>
        <div class="price-card">
          <div class="price-label">Prev Close</div>
          <div class="price-value">${fmt(ltp.close)}</div>
        </div>
        <div class="price-card">
          <div class="price-label">Volume</div>
          <div class="price-value">${fmtN(ltp.volume)}</div>
        </div>
      </div>`;
  }

  // Option chain section (for any underlying that has FNO)
  const ocSection = `
    <div style="border-top:1px solid #2d2b4e; padding-top:20px; margin-top:4px;">
      <div class="oc-controls">
        <strong style="color:#a78bfa; font-size:0.9em;">&#x1F4CA; Option Chain</strong>
        <select class="oc-select" id="expirySelect" onchange="loadOptionChain('${short}','${exch}')">
          <option value="">Loading expiries…</option>
        </select>
        <button class="btn-load" onclick="loadOptionChain('${short}','${exch}')">Load Chain</button>
      </div>
      <div id="ocBody">
        <div class="state-box" style="padding:24px">Select an expiry to view option chain</div>
      </div>
    </div>`;

  document.getElementById('detailPanel').innerHTML = `
    <div class="detail-panel">
      <div class="detail-header">
        <div class="detail-symbol">${short}</div>
        <div class="detail-name">${name} &bull; ${exch} &bull; Code: ${code}</div>
      </div>
      ${priceHtml}
      ${ocSection}
    </div>`;

  loadExpiries(short, exch);
}

// ── Expiry ─────────────────────────────────────────────────────────────────
async function loadExpiries(symbol, exch) {
  const data = await api(`/api/expiry?exch=${exch}&symbol=${encodeURIComponent(symbol)}`);
  const sel  = document.getElementById('expirySelect');
  if (!sel) return;
  if (data.error || !data.expiries?.length) {
    sel.innerHTML = '<option value="">No expiries available</option>';
    return;
  }
  sel.innerHTML = data.expiries.map(e =>
    `<option value="${e}">${e}</option>`
  ).join('');
}

// ── Option Chain ───────────────────────────────────────────────────────────
async function loadOptionChain(symbol, exch) {
  const sel    = document.getElementById('expirySelect');
  const expiry = sel?.value;
  if (!expiry) return;

  document.getElementById('ocBody').innerHTML =
    '<div class="state-box" style="padding:24px"><div class="spinner"></div>Loading option chain…</div>';

  const data = await api(
    `/api/option-chain?exch=${exch}&symbol=${encodeURIComponent(symbol)}&expiry=${encodeURIComponent(expiry)}`
  );

  if (data.error) {
    document.getElementById('ocBody').innerHTML =
      `<div class="state-box" style="padding:20px">&#x26A0; ${data.error}</div>`;
    return;
  }
  if (!data.option_chain?.length) {
    document.getElementById('ocBody').innerHTML =
      '<div class="state-box" style="padding:20px">No option chain data</div>';
    return;
  }

  // Find ATM (strike closest to LTP)
  const ltpEl = document.querySelector('.ltp-value');
  const curLtp = ltpEl ? parseFloat(ltpEl.textContent.replace(/[^0-9.]/g,'')) : 0;
  const strikes = data.option_chain.map(r => r.strike);
  const atm = strikes.reduce((a, b) => Math.abs(b - curLtp) < Math.abs(a - curLtp) ? b : a, strikes[0]);

  const rows = data.option_chain.map(r => {
    const isAtm = r.strike === atm;
    return `<tr class="${isAtm ? 'atm' : ''}">
      <td class="${cls(r.ce_change)}">${fmt(r.ce_ltp)}</td>
      <td>${fmtN(r.ce_oi)}</td>
      <td>${fmtN(r.ce_volume)}</td>
      <td class="strike-col">${r.strike}</td>
      <td>${fmtN(r.pe_volume)}</td>
      <td>${fmtN(r.pe_oi)}</td>
      <td class="${cls(r.pe_change)}">${fmt(r.pe_ltp)}</td>
    </tr>`;
  }).join('');

  document.getElementById('ocBody').innerHTML = `
    <div class="oc-table-wrap">
      <table class="oc-table">
        <thead>
          <tr>
            <th class="call-side" colspan="3">CALLS</th>
            <th class="strike-col">STRIKE</th>
            <th class="put-side" colspan="3">PUTS</th>
          </tr>
          <tr>
            <th class="call-side">LTP</th>
            <th class="call-side">OI</th>
            <th class="call-side">Volume</th>
            <th class="strike-col">&#x2B50;</th>
            <th class="put-side">Volume</th>
            <th class="put-side">OI</th>
            <th class="put-side">LTP</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// ── Init ───────────────────────────────────────────────────────────────────
loadHoldings();
setInterval(loadHoldings, 60000);
</script>
</body>
