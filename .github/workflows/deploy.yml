name: Deploy to DigitalOcean

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Terraform
        run: |
          wget https://releases.hashicorp.com/terraform/1.6.0/terraform_1.6.0_linux_amd64.zip
          unzip terraform_1.6.0_linux_amd64.zip
          sudo mv terraform /usr/local/bin/
          terraform --version

      - name: Initialize Terraform
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          cd terraform
          terraform init
          echo "Terraform initialized"

      - name: Create DigitalOcean Droplet
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          cd terraform
          terraform apply -auto-approve -var="digitalocean_token=$DIGITALOCEAN_TOKEN"
          terraform output -raw droplet_ip > ../droplet_ip.txt
          cat ../droplet_ip.txt

      - name: Wait for Droplet
        run: |
          echo "Waiting for Droplet to initialize..."
          sleep 60

      - name: Deploy Bot Code
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          DROPLET_IP=$(cat droplet_ip.txt)
          echo "Droplet IP: $DROPLET_IP"

          # Wait for SSH to be ready
          for i in {1..30}; do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -o BatchMode=yes root@$DROPLET_IP "echo 'SSH ready'" 2>/dev/null; then
              echo "✅ SSH connection established"
              break
            fi
            echo "Waiting for SSH... attempt $i/30"
            sleep 10
          done

          # Deploy code
          ssh -o StrictHostKeyChecking=no root@$DROPLET_IP << 'EOFSH'
          echo "🤖 Starting deployment..."

          # Remove old code
          rm -rf /root/5t || true

          # Clone repository
          cd /root
          git clone https://github.com/saurabh257257/5t.git
          cd /root/5t/server

          # Install dependencies
          npm install --production

          # Setup environment
          cat > .env << 'EOF'
          APP_NAME=5P58004979
          APP_SOURCE=24930
          USER_ID=47xt4VnND2x
          PASSWORD=B356hBPBrAK
          USER_KEY=PyA72PuyUjYUiNavyRlN0bdLnc7aFeKp
          ENCRYPTION_KEY=wnzELKnWbdH3KYdgAyW0EwLdVpnk2O1D
          PORT=3000
          NODE_ENV=production
          EOF

          # Start with PM2
          pm2 delete trading-bot 2>/dev/null || true
          pm2 start app.js --name "trading-bot" --instances 1 --exec-mode fork
          pm2 save

          echo "✅ Bot deployed successfully!"
          EOFSH

      - name: Verify Deployment
        run: |
          DROPLET_IP=$(cat droplet_ip.txt)
          echo "🎉 Deployment Complete!"
          echo "Server IP: $DROPLET_IP"
          echo "Access bot at: http://$DROPLET_IP:3000"
          echo ""
          echo "Next steps:"
          echo "1. Wait 2-3 minutes for bot to fully start"
          echo "2. Visit: http://$DROPLET_IP:3000"
          echo "3. Configure support/resistance via API"
          echo "4. Start trading!"

      - name: Display Output
        if: always()
        run: |
          if [ -f droplet_ip.txt ]; then
            DROPLET_IP=$(cat droplet_ip.txt)
            echo "DROPLET_IP=$DROPLET_IP" >> $GITHUB_ENV
          fi
