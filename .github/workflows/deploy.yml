name: Deploy 5T Trading Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Droplet (if not exists)
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          #!/bin/bash
          set -e

          # Check if droplet already exists
          DROPLET=$(curl -s -X GET \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DO_TOKEN" \
            "https://api.digitalocean.com/v2/droplets?tag_name=5t-trading-bot" | jq -r '.droplets[0].id // "null"')

          if [ "$DROPLET" = "null" ]; then
            echo "Creating new Droplet..."

            # Create droplet
            DROPLET_RESPONSE=$(curl -s -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DO_TOKEN" \
              -d '{
                "name": "5t-trading-bot",
                "region": "blr1",
                "size": "s-1vcpu-512mb-10gb",
                "image": "ubuntu-22-04-x64",
                "backups": false,
                "ipv6": true,
                "monitoring": true,
                "tags": ["5t-trading-bot"],
                "user_data": "#!/bin/bash\nset -e\napt-get update -y\napt-get upgrade -y\ncurl -fsSL https://deb.nodesource.com/setup_18.x | bash -\napt-get install -y nodejs git curl wget\nnpm install -g pm2 --silent\npm2 startup -u root --hp /root > /dev/null 2>&1 || true\npm2 save\ncd /root\nrm -rf 5t || true\ngit clone https://github.com/saurabh257257/5t.git 5t\ncd 5t/server\ncat > .env << EOF\nAPP_NAME=5P58004979\nAPP_SOURCE=24930\nUSER_ID=47xt4VnND2x\nPASSWORD=B356hBPBrAK\nUSER_KEY=PyA72PuyUjYUiNavyRlN0bdLnc7aFeKp\nENCRYPTION_KEY=wnzELKnWbdH3KYdgAyW0EwLdVpnk2O1D\nPORT=3000\nNODE_ENV=production\nEOF\nnpm install --production\npm2 delete trading-bot 2>/dev/null || true\npm2 start app.js --name trading-bot\npm2 save\nufw allow 3000/tcp 2>/dev/null || true\nufw enable -y 2>/dev/null || true\necho \"✅ 5T Trading Bot Ready at http://\$(hostname -I | awk '\''{print \$1}'\''):3000\""
              }' \
              "https://api.digitalocean.com/v2/droplets")

            DROPLET_ID=$(echo $DROPLET_RESPONSE | jq -r '.droplet.id')
            echo "Droplet created with ID: $DROPLET_ID"
            echo "DROPLET_ID=$DROPLET_ID" >> $GITHUB_ENV

            # Wait for droplet to be active
            echo "Waiting for Droplet to be active..."
            for i in {1..60}; do
              STATUS=$(curl -s -X GET \
                -H "Authorization: Bearer $DO_TOKEN" \
                "https://api.digitalocean.com/v2/droplets/$DROPLET_ID" | jq -r '.droplet.status')

              if [ "$STATUS" = "active" ]; then
                echo "✅ Droplet is active"
                break
              fi
              echo "Status: $STATUS (attempt $i/60)"
              sleep 5
            done

            # Get droplet IP
            DROPLET_IP=$(curl -s -X GET \
              -H "Authorization: Bearer $DO_TOKEN" \
              "https://api.digitalocean.com/v2/droplets/$DROPLET_ID" | jq -r '.droplet.networks.v4[0].ip_address')

            echo "Droplet IP: $DROPLET_IP"
            echo "DROPLET_IP=$DROPLET_IP" >> $GITHUB_ENV
          else
            echo "Droplet already exists with ID: $DROPLET"

            # Get droplet IP
            DROPLET_IP=$(curl -s -X GET \
              -H "Authorization: Bearer $DO_TOKEN" \
              "https://api.digitalocean.com/v2/droplets/$DROPLET" | jq -r '.droplet.networks.v4[0].ip_address')

            echo "Droplet IP: $DROPLET_IP"
            echo "DROPLET_IP=$DROPLET_IP" >> $GITHUB_ENV
          fi

      - name: Wait for Server
        run: |
          DROPLET_IP=${{ env.DROPLET_IP }}

          echo "Waiting for server to be ready..."
          for i in {1..30}; do
            if curl -s "http://$DROPLET_IP:3000" > /dev/null 2>&1; then
              echo "✅ Server is responding"
              exit 0
            fi
            echo "Waiting for server... attempt $i/30"
            sleep 10
          done

          echo "Server did not respond in time, but it may still be starting..."

      - name: Deployment Success
        run: |
          echo "🎉 5T Trading Bot Deployment Complete!"
          echo ""
          echo "✅ Droplet created and running"
          echo "✅ Bot code deployed"
          echo "✅ PM2 managing the process"
          echo ""
          echo "Server URL: http://${{ env.DROPLET_IP }}:3000"
          echo ""
          echo "Next steps:"
          echo "1. Open: http://${{ env.DROPLET_IP }}:3000 in your browser"
          echo "2. Configure daily support/resistance levels"
          echo "3. Build Android app with this server URL"
          echo "4. Start trading!"
