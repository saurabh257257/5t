name: Deploy to Droplet
# SSH key-based deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 143.244.140.57 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy Bot via SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 -o ConnectTimeout=10 root@143.244.140.57 bash << 'EOFSH'
          set -e
          echo "🤖 Deploying 5T Trading Bot..."

          # Wait for network to be ready
          echo "Waiting for network connectivity..."
          for i in {1..30}; do
            if ping -c 1 8.8.8.8 &> /dev/null; then
              echo "✅ Network ready"
              break
            fi
            echo "Waiting... attempt $i/30"
            sleep 2
          done

          if [ ! -d "/root/5t" ]; then
            echo "First deployment - cloning repository..."
            cd /root
            apt-get update -y && apt-get install -y git
            git clone --depth 1 https://github.com/saurabh257257/5t.git 5t 2>&1 || {
              echo "Git clone failed, retrying..."
              sleep 5
              git clone --depth 1 https://github.com/saurabh257257/5t.git 5t
            }
          else
            echo "Updating existing installation..."
            cd /root/5t
            git pull origin main || echo "Git pull skipped"
          fi
          cd /root/5t/server

          # Install Node.js if not present
          if ! command -v npm &> /dev/null; then
            echo "Installing Node.js..."
            curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
            apt-get install -y nodejs
          fi

          npm install --production
          if [ ! -f ".env" ]; then
            cat > .env << 'EOF'
          APP_NAME=5P58004979
          APP_SOURCE=24930
          USER_ID=47xt4VnND2x
          PASSWORD=B356hBPBrAK
          USER_KEY=PyA72PuyUjYUiNavyRlN0bdLnc7aFeKp
          ENCRYPTION_KEY=wnzELKnWbdH3KYdgAyW0EwLdVpnk2O1D
          PORT=3000
          NODE_ENV=production
          EOF
          fi
          pm2 delete trading-bot 2>/dev/null || true
          pm2 start app.js --name trading-bot --instances 1
          pm2 save
          echo "✅ Bot deployed successfully!"
          sleep 2
          pm2 status
          EOFSH

      - name: Verify Deployment
        run: |
          echo "Waiting for bot to start..."
          sleep 5

          for i in {1..10}; do
            STATUS=$(curl -s http://143.244.140.57:3000/api/status 2>/dev/null || echo "offline")
            if [[ $STATUS == *"running"* ]]; then
              echo "✅ Bot is running!"
              echo "Response: $STATUS"
              exit 0
            fi
            echo "Attempt $i/10 - Bot starting..."
            sleep 3
          done

          echo "⚠️ Bot may still be starting, check logs with:"
          echo "ssh -i ~/.ssh/id_ed25519 root@143.244.140.57"
          echo "pm2 logs trading-bot"

      - name: Deployment Complete
        run: |
          echo "🎉 Deployment Complete!"
          echo ""
          echo "✅ Server: http://143.244.140.57:3000"
          echo ""
          echo "Check status:"
          echo "  curl http://143.244.140.57:3000/api/status"
          echo ""
          echo "View logs:"
          echo "  ssh -i ~/.ssh/id_ed25519 root@143.244.140.57"
          echo "  pm2 logs trading-bot"
