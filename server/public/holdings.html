<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holdings - 5T Trading Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        header h1 {
            font-size: 2.5em;
        }

        .back-link {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            transition: background 0.3s;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .stat-value.profit {
            color: #10b981;
        }

        .stat-value.loss {
            color: #ef4444;
        }

        .section {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        table thead {
            background: #f9fafb;
            border-bottom: 2px solid #e5e7eb;
        }

        table th {
            padding: 15px;
            text-align: left;
            font-weight: bold;
            color: #333;
            text-transform: uppercase;
            font-size: 0.85em;
        }

        table td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
            color: #666;
        }

        table tr:hover {
            background: #f9fafb;
        }

        .status-open {
            display: inline-block;
            background: #dbeafe;
            color: #0c4a6e;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .status-closed {
            display: inline-block;
            background: #f0fdf4;
            color: #166534;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .type-call {
            color: #059669;
            font-weight: bold;
        }

        .type-put {
            color: #dc2626;
            font-weight: bold;
        }

        .pnl-positive {
            color: #10b981;
            font-weight: bold;
        }

        .pnl-negative {
            color: #ef4444;
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group select {
            padding: 8px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 5px;
            font-size: 0.95em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .alert-error {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #dc2626;
        }

        .alert-success {
            background: #dcfce7;
            border: 1px solid #86efac;
            color: #166534;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.75em;
            font-weight: bold;
            margin-left: 5px;
        }

        .badge-call {
            background: #dcfce7;
            color: #166534;
        }

        .badge-put {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-profit {
            background: #dcfce7;
            color: #166534;
        }

        .badge-loss {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
            }

            header h1 {
                font-size: 1.8em;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 0.9em;
            }

            table th,
            table td {
                padding: 10px 5px;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💼 Holdings & History</h1>
            <a href="/" class="back-link">← Back to Dashboard</a>
        </header>

        <!-- Summary Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Trades</div>
                <div class="stat-value" id="totalTrades">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Open Positions</div>
                <div class="stat-value" id="openPositions">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Closed Trades</div>
                <div class="stat-value" id="closedTrades">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total P&L</div>
                <div class="stat-value" id="totalPnl">₹0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Win Rate</div>
                <div class="stat-value" id="winRate">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Avg Profit</div>
                <div class="stat-value" id="avgProfit">₹0</div>
            </div>
        </div>

        <!-- Open Positions -->
        <div class="section">
            <div class="section-title">📈 Open Positions</div>
            <div class="controls">
                <button class="btn-primary" onclick="loadData()">🔄 Refresh</button>
            </div>
            <div id="openPositionsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading positions...
                </div>
            </div>
        </div>

        <!-- Trade History -->
        <div class="section">
            <div class="section-title">📊 Trade History</div>
            <div class="controls">
                <div class="filter-group">
                    <label>Filter by:</label>
                    <select id="typeFilter" onchange="loadData()">
                        <option value="">All Types</option>
                        <option value="CALL">CALL</option>
                        <option value="PUT">PUT</option>
                    </select>
                    <select id="statusFilter" onchange="loadData()">
                        <option value="">All Status</option>
                        <option value="open">Open</option>
                        <option value="closed">Closed</option>
                    </select>
                </div>
                <button class="btn-secondary" onclick="exportCSV()">📥 Export CSV</button>
            </div>
            <div id="historyContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading history...
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        // Load data on page load
        window.addEventListener('load', () => {
            loadData();
            setInterval(loadData, 10000); // Refresh every 10 seconds
        });

        async function loadData() {
            try {
                // Fetch all trades
                const response = await fetch(`${API_BASE}/api/trades`);
                const trades = await response.json();

                if (!Array.isArray(trades)) {
                    trades = [];
                }

                // Apply filters
                const typeFilter = document.getElementById('typeFilter').value;
                const statusFilter = document.getElementById('statusFilter').value;

                let filteredTrades = trades.filter(trade => {
                    if (typeFilter && trade.type !== typeFilter) return false;
                    if (statusFilter === 'open' && trade.status !== 'open') return false;
                    if (statusFilter === 'closed' && trade.status !== 'closed') return false;
                    return true;
                });

                // Separate open and closed trades
                const openTrades = trades.filter(t => t.status === 'open');
                const closedTrades = trades.filter(t => t.status === 'closed');

                // Calculate stats
                calculateStats(trades);

                // Render open positions
                renderOpenPositions(openTrades);

                // Render history
                renderHistory(filteredTrades);
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('openPositionsContainer').innerHTML =
                    `<div class="alert alert-error">Error loading positions: ${error.message}</div>`;
                document.getElementById('historyContainer').innerHTML =
                    `<div class="alert alert-error">Error loading history: ${error.message}</div>`;
            }
        }

        function calculateStats(trades) {
            const totalTrades = trades.length;
            const openPositions = trades.filter(t => t.status === 'open').length;
            const closedTrades = trades.filter(t => t.status === 'closed').length;
            const totalPnl = trades.reduce((sum, t) => sum + (t.profit_loss || 0), 0);
            const winningTrades = trades.filter(t => t.profit_loss > 0).length;
            const winRate = totalTrades > 0 ? ((winningTrades / totalTrades) * 100).toFixed(1) : 0;
            const avgProfit = closedTrades > 0 ? (totalPnl / closedTrades).toFixed(2) : 0;

            document.getElementById('totalTrades').textContent = totalTrades;
            document.getElementById('openPositions').textContent = openPositions;
            document.getElementById('closedTrades').textContent = closedTrades;

            const pnlElement = document.getElementById('totalPnl');
            pnlElement.textContent = `₹${totalPnl.toFixed(2)}`;
            pnlElement.className = 'stat-value ' + (totalPnl >= 0 ? 'profit' : 'loss');

            document.getElementById('winRate').textContent = winRate + '%';

            const avgElement = document.getElementById('avgProfit');
            avgElement.textContent = `₹${avgProfit}`;
            avgElement.className = 'stat-value ' + (avgProfit >= 0 ? 'profit' : 'loss');
        }

        function renderOpenPositions(trades) {
            const container = document.getElementById('openPositionsContainer');

            if (trades.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎯</div>
                        <p>No open positions</p>
                    </div>
                `;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Symbol</th>
                            <th>Strike Price</th>
                            <th>Entry Price</th>
                            <th>Quantity</th>
                            <th>Current P&L</th>
                            <th>Status</th>
                            <th>Opened</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            trades.forEach(trade => {
                const pnl = trade.profit_loss || 0;
                const pnlClass = pnl >= 0 ? 'pnl-positive' : 'pnl-negative';
                const createdAt = new Date(trade.created_at).toLocaleDateString('en-IN');

                html += `
                    <tr>
                        <td><span class="type-${trade.type.toLowerCase()}">${trade.type}</span></td>
                        <td>${trade.symbol}</td>
                        <td>₹${trade.strike_price.toLocaleString('en-IN')}</td>
                        <td>₹${trade.entry_price.toLocaleString('en-IN')}</td>
                        <td>${trade.quantity}</td>
                        <td><span class="${pnlClass}">₹${pnl.toFixed(2)}</span></td>
                        <td><span class="status-open">OPEN</span></td>
                        <td>${createdAt}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        function renderHistory(trades) {
            const container = document.getElementById('historyContainer');

            if (trades.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>No trades found</p>
                    </div>
                `;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Symbol</th>
                            <th>Strike Price</th>
                            <th>Entry Price</th>
                            <th>Exit Price</th>
                            <th>Quantity</th>
                            <th>P&L</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            trades.forEach(trade => {
                const pnl = trade.profit_loss || 0;
                const statusBadge = trade.status === 'open' ?
                    '<span class="status-open">OPEN</span>' :
                    '<span class="status-closed">CLOSED</span>';
                const pnlClass = pnl >= 0 ? 'pnl-positive' : 'pnl-negative';
                const createdAt = new Date(trade.created_at).toLocaleDateString('en-IN');

                html += `
                    <tr>
                        <td><span class="type-${trade.type.toLowerCase()}">${trade.type}</span></td>
                        <td>${trade.symbol}</td>
                        <td>₹${trade.strike_price.toLocaleString('en-IN')}</td>
                        <td>₹${trade.entry_price.toLocaleString('en-IN')}</td>
                        <td>${trade.exit_price ? '₹' + trade.exit_price.toLocaleString('en-IN') : '-'}</td>
                        <td>${trade.quantity}</td>
                        <td><span class="${pnlClass}">₹${pnl.toFixed(2)}</span></td>
                        <td>${statusBadge}</td>
                        <td>${createdAt}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        function exportCSV() {
            // Get all trades
            fetch(`${API_BASE}/api/trades`)
                .then(r => r.json())
                .then(trades => {
                    let csv = 'Type,Symbol,Strike Price,Entry Price,Exit Price,Quantity,P&L,Status,Date\n';

                    trades.forEach(trade => {
                        const pnl = trade.profit_loss || 0;
                        const exitPrice = trade.exit_price || '';
                        const createdAt = new Date(trade.created_at).toLocaleDateString('en-IN');

                        csv += `${trade.type},${trade.symbol},${trade.strike_price},${trade.entry_price},${exitPrice},${trade.quantity},${pnl.toFixed(2)},${trade.status},${createdAt}\n`;
                    });

                    // Download CSV
                    const element = document.createElement('a');
                    element.setAttribute('href', 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv));
                    element.setAttribute('download', `trading-history-${new Date().toISOString().split('T')[0]}.csv`);
                    element.style.display = 'none';
                    document.body.appendChild(element);
                    element.click();
                    document.body.removeChild(element);
                });
        }
    </script>
</body>
</html>
